  // ============================================================
  // 历史记录（localStorage + PropertiesService 同步）
  // ============================================================

  function syncHistoryFromBackend() {
    if (!window.google || !google.script || !google.script.run) return;
    google.script.run
      .withSuccessHandler(function(remote) {
        if (!remote) return;
        applyBackendHistory_(remote);
      })
      .withFailureHandler(function() {})
      .getQueryHistory();
  }

  function applyBackendHistory_(remote) {
    var localSqlBefore = getRawLocalSqlHistory_();
    var localEnabled = isHistoryEnabled();

    if (remote.enabled === false) {
      setHistoryEnabled(false);
    } else {
      setHistoryEnabled(true);
    }

    var remoteSql = Array.isArray(remote.sqlItems) ? remote.sqlItems : [];
    if (remoteSql.length > 0 || localSqlBefore.length === 0) {
      try { localStorage.setItem(HISTORY_KEY, JSON.stringify(remoteSql)); } catch (e) {}
      renderHistory(remoteSql);
    } else if (localEnabled) {
      for (var i = localSqlBefore.length - 1; i >= 0; i--) {
        mirrorHistoryCall_('appendSqlHistory', localSqlBefore[i]);
      }
    }
  }

  function getRawLocalSqlHistory_() {
    try {
      var stored = localStorage.getItem(HISTORY_KEY);
      var parsed = stored ? JSON.parse(stored) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  }

  function mirrorHistoryCall_(fnName, arg) {
    if (!window.google || !google.script || !google.script.run) return;
    var noop = function() {};
    switch (fnName) {
      case 'appendSqlHistory':
        google.script.run.withSuccessHandler(noop).withFailureHandler(noop).appendSqlHistory(arg); return;
      case 'removeSqlHistoryAt':
        google.script.run.withSuccessHandler(noop).withFailureHandler(noop).removeSqlHistoryAt(arg); return;
      case 'clearSqlHistory':
        google.script.run.withSuccessHandler(noop).withFailureHandler(noop).clearSqlHistory(); return;
      case 'setSqlHistoryEnabled':
        google.script.run.withSuccessHandler(noop).withFailureHandler(noop).setSqlHistoryEnabled(arg); return;
    }
  }

  function loadHistory() {
    renderHistory(getHistoryList());
  }

  function saveToHistory(sql) {
    if (!isHistoryEnabled()) return;
    var list = getHistoryList();
    list = list.filter(function(item) { return item !== sql; });
    list.unshift(sql);
    if (list.length > MAX_HISTORY) list = list.slice(0, MAX_HISTORY);
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch (e) {}
    renderHistory(list);
    mirrorHistoryCall_('appendSqlHistory', sql);
  }

  function deleteFromHistory(sql) {
    var list = getHistoryList();
    var index = list.indexOf(sql);
    list = list.filter(function(item) { return item !== sql; });
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch (e) {}
    renderHistory(list);
    if (index >= 0) mirrorHistoryCall_('removeSqlHistoryAt', index);
  }

  function clearHistory() {
    if (!confirm(t('historyClearConfirm'))) return;
    try { localStorage.removeItem(HISTORY_KEY); } catch (e) {}
    renderHistory([]);
    mirrorHistoryCall_('clearSqlHistory');
  }

  function isHistoryEnabled() {
    try { return localStorage.getItem(HISTORY_ENABLED_KEY) !== 'false'; } catch (e) { return true; }
  }

  function setHistoryEnabled(enabled) {
    try { localStorage.setItem(HISTORY_ENABLED_KEY, enabled ? 'true' : 'false'); } catch (e) {}
  }

  function getHistoryList() {
    if (!isHistoryEnabled()) return [];
    try {
      var stored = localStorage.getItem(HISTORY_KEY);
      return stored ? JSON.parse(stored) : [];
    } catch (e) { return []; }
  }

  function renderHistory(list) {
    var container = document.getElementById('historyList');
    container.innerHTML = '';
    if (list.length === 0) return;

    list.forEach(function(sql) {
      var div = document.createElement('div');
      div.className = 'recent-item';
      div.innerHTML =
        '<div class="recent-query">' + escapeHtml(sql) + '</div>' +
        '<span class="recent-delete">Remove</span>';

      div.querySelector('.recent-query').addEventListener('click', function() {
        // 插入到第一个 SQL 模式任务卡
        var targetTask = tasks[0];
        if (targetTask) {
          setTaskMode(targetTask.id, 'sql');
          var sqlInput = document.getElementById('sqlInput-' + targetTask.id);
          if (sqlInput) { sqlInput.value = sql; sqlInput.focus(); }
        }
      });

      div.querySelector('.recent-delete').addEventListener('click', function(e) {
        e.stopPropagation();
        deleteFromHistory(sql);
      });

      container.appendChild(div);
    });
  }

  // ============================================================
  // 客户端只读 SQL 预检
  // ============================================================

  function getClientReadOnlySqlError(sql) {
    var statements = splitClientSqlStatements(sql);
    var hasMainQuery = false;
    for (var i = 0; i < statements.length; i++) {
      var statement = statements[i];
      var keyword = getClientFirstSqlKeyword(statement);
      if (!keyword) continue;
      if (keyword === 'SET') {
        if (hasMainQuery) return t('errorSetBeforeQuery');
        if (containsClientReservedAuditSetStatement(statement)) return t('errorReservedAuditSet');
        continue;
      }
      if (hasMainQuery) return t('errorSingleReadOnlyQuery');
      if (isClientForbiddenSqlKeyword(keyword) ||
          (shouldClientCheckNestedForbiddenSqlOperation(keyword) && containsClientForbiddenSqlOperation(statement))) {
        return t('errorReadOnlySql');
      }
      if (!isClientAllowedReadOnlySqlKeyword(keyword)) return t('errorReadOnlySql');
      hasMainQuery = true;
    }
    return hasMainQuery ? '' : t('errorReadOnlySql');
  }

  function splitClientSqlStatements(sql) {
    var statements = [];
    var current = [];
    var quote = null;
    var lineComment = false;
    var blockComment = false;
    for (var i = 0; i < sql.length; i++) {
      var ch = sql.charAt(i);
      var next = i + 1 < sql.length ? sql.charAt(i + 1) : '';
      if (lineComment) {
        if (ch === '\n' || ch === '\r') { lineComment = false; current.push(' '); }
        continue;
      }
      if (blockComment) {
        if (ch === '*' && next === '/') { blockComment = false; current.push(' '); i++; }
        continue;
      }
      if (quote) {
        current.push(ch);
        if (ch === '\\' && next) { current.push(next); i++; }
        else if (ch === quote) {
          if (next === quote) { current.push(next); i++; }
          else { quote = null; }
        }
        continue;
      }
      if (ch === '-' && next === '-') { lineComment = true; current.push(' '); i++; continue; }
      if (ch === '/' && next === '*') { blockComment = true; current.push(' '); i++; continue; }
      if (ch === '\'' || ch === '"' || ch === '`') { quote = ch; current.push(ch); continue; }
      if (ch === ';') {
        var stmt = current.join('').replace(/^\s+|\s+$/g, '');
        if (stmt) statements.push(stmt);
        current = [];
        continue;
      }
      current.push(ch);
    }
    var last = current.join('').replace(/^\s+|\s+$/g, '');
    if (last) statements.push(last);
    return statements;
  }

  function getClientFirstSqlKeyword(statement) {
    var normalized = maskClientSqlCommentsAndLiterals(statement).replace(/^\s+/, '').replace(/^[\s(]+/, '');
    var match = normalized.match(/^([A-Za-z_]+)/);
    return match ? match[1].toUpperCase() : '';
  }

  function isClientAllowedReadOnlySqlKeyword(keyword) {
    return keyword === 'SELECT' || keyword === 'WITH';
  }

  function isClientForbiddenSqlKeyword(keyword) {
    return {
      INSERT:1,UPDATE:1,DELETE:1,MERGE:1,CREATE:1,ALTER:1,DROP:1,TRUNCATE:1,
      RENAME:1,GRANT:1,REVOKE:1,LOAD:1,UNLOAD:1,ANALYZE:1,CALL:1,USE:1,
      BEGIN:1,COMMIT:1,ROLLBACK:1
    }[keyword] === 1;
  }

  function containsClientReservedAuditSetStatement(statement) {
    var s = maskClientSqlCommentsAndLiterals(statement);
    return /\bset\s+ext_(?:platform_id|node_id|dagtype|task_id|node_name|node_onduty)\b/i.test(s);
  }

  function shouldClientCheckNestedForbiddenSqlOperation(keyword) {
    return keyword === 'SELECT' || keyword === 'WITH';
  }

  function containsClientForbiddenSqlOperation(statement) {
    var s = maskClientSqlCommentsAndLiterals(statement);
    var patterns = [
      /\binsert\s+(?:into|overwrite)\b/i,
      /\bupdate\s+[\s\S]+?\bset\b/i,
      /\bdelete\s+from\b/i,
      /\bmerge\s+into\b/i,
      /\bcreate\s+(?:or\s+replace\s+)?(?:external\s+)?(?:materialized\s+)?(?:table|view|function|resource|instance|schema|database|role|package|volume|model)\b/i,
      /\balter\s+(?:materialized\s+)?(?:table|view|function|resource|schema|database|role|package|volume|model)\b/i,
      /\bdrop\s+(?:materialized\s+)?(?:table|view|function|resource|schema|database|role|package|volume|model)\b/i,
      /\btruncate\s+table\b/i,
      /\brename\s+table\b/i,
      /\bmsck\s+repair\s+table\b/i,
      /\badd\s+(?:file|jar|archive|py|resource|user)\b/i,
      /\bremove\s+(?:file|jar|archive|py|resource|user)\b/i,
      /\b(?:install|uninstall)\s+package\b/i,
      /\bgrant\b/i, /\brevoke\b/i,
      /\bload\s+data\b/i, /\bunload\b/i,
      /\banalyze\s+(?:table|column|columns)\b/i,
      /\bcall\b/i, /\buse\s+\S+/i,
      /\bbegin\b/i, /\bcommit\b/i, /\brollback\b/i
    ];
    for (var i = 0; i < patterns.length; i++) {
      if (patterns[i].test(s)) return true;
    }
    return false;
  }

  function maskClientSqlCommentsAndLiterals(sql) {
    var out = [];
    var quote = null;
    var lineComment = false;
    var blockComment = false;
    for (var i = 0; i < sql.length; i++) {
      var ch = sql.charAt(i);
      var next = i + 1 < sql.length ? sql.charAt(i + 1) : '';
      if (lineComment) {
        if (ch === '\n' || ch === '\r') { lineComment = false; out.push(ch); } else { out.push(' '); }
        continue;
      }
      if (blockComment) {
        if (ch === '*' && next === '/') { blockComment = false; out.push('  '); i++; } else { out.push(' '); }
        continue;
      }
      if (quote) {
        out.push(' ');
        if (ch === '\\' && next) { out.push(' '); i++; }
        else if (ch === quote) {
          if (next === quote) { out.push(' '); i++; } else { quote = null; }
        }
        continue;
      }
      if (ch === '-' && next === '-') { lineComment = true; out.push('  '); i++; continue; }
      if (ch === '/' && next === '*') { blockComment = true; out.push('  '); i++; continue; }
      if (ch === '\'' || ch === '"' || ch === '`') { quote = ch; out.push(' '); continue; }
      out.push(ch);
    }
    return out.join('');
  }

  function getClientInstanceIdError(instanceId) {
    instanceId = String(instanceId || '').trim();
    if (!instanceId) return t('errorEmptyInstanceId');
    if (instanceId.length > 128 || !/^[A-Za-z0-9_.:-]+$/.test(instanceId) || instanceId.indexOf('..') !== -1) {
      return t('errorInvalidInstanceId');
    }
    return '';
  }

  // ============================================================
  // UI 辅助函数
  // ============================================================

  function escapeHtml(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function escapeAttr(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function formatMs(ms) {
    if (!ms && ms !== 0) return '-';
    if (ms < 1000) return ms + ' ms';
    return (ms / 1000).toFixed(1) + ' s';
  }

  function getSafeServerErrorMessage(error) {
    var raw = String(error && error.message ? error.message : error || '').replace(/[\r\n\t]+/g, ' ').replace(/\s{2,}/g, ' ').trim();
    return raw.length <= 500 ? raw : raw.slice(0, 500) + '...';
  }

  function showNotification(type, message) {
    var el = document.getElementById('notification');
    el.className = 'notification visible ' + type;
    el.textContent = message;
    if (notificationTimer) clearTimeout(notificationTimer);
    notificationTimer = setTimeout(function() {
      el.classList.remove('visible');
    }, 5000);
  }

  function formatTimeAgo(timestamp) {
    var diff = Date.now() - timestamp;
    if (diff < 60000) return 'just now';
    if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
    if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
    return Math.floor(diff / 86400000) + 'd ago';
  }

  function formatTimeFuture(timestamp) {
    var diff = timestamp - Date.now();
    if (diff < 0) return 'overdue';
    if (diff < 60000) return 'soon';
    if (diff < 3600000) return 'in ' + Math.ceil(diff / 60000) + 'm';
    if (diff < 86400000) return 'in ' + Math.ceil(diff / 3600000) + 'h';
    return 'in ' + Math.ceil(diff / 86400000) + 'd';
  }

  function formatJobTime(timestamp) {
    if (!timestamp) return '';
    var d = new Date(timestamp);
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    var hh = String(d.getHours()).padStart(2, '0');
    var mi = String(d.getMinutes()).padStart(2, '0');
    return mm + '-' + dd + ' ' + hh + ':' + mi;
  }

  // ============================================================
  // Export Tab
  // ============================================================

  function initExportTab() {
    google.script.run
      .withSuccessHandler(function(status) {
        var ossConfigured = !!(status && status.configured);
        if (ossConfigured) {
          document.getElementById('exportNotConfigured').style.display = 'none';
          document.getElementById('exportForm').style.display = 'block';
          loadExportPreferences();
          if (sheetNames.length === 0) {
            refreshSheetNames(renderExportSheetList);
          } else {
            renderExportSheetList();
          }
        } else {
          document.getElementById('exportNotConfigured').style.display = 'block';
          document.getElementById('exportForm').style.display = 'none';
        }
      })
      .withFailureHandler(function() {
        document.getElementById('exportNotConfigured').style.display = 'block';
        document.getElementById('exportForm').style.display = 'none';
      })
      .getOssExportStatus();
  }

  function loadExportPreferences() {
    var prefs = (__INIT__ && __INIT__.exportPreferences) || {};
    document.getElementById('exportPrefix').value = prefs.prefix || '';
    document.getElementById('exportTemplate').value = prefs.template || '{prefix}{sheet}_{date}.csv';
  }

  function renderExportSheetList() {
    var container = document.getElementById('exportSheetItems');
    container.innerHTML = '';
    var names = sheetNames || [];
    exportState.selectedSheets = {};

    for (var i = 0; i < names.length; i++) {
      exportState.selectedSheets[names[i]] = true;
      var item = document.createElement('div');
      item.className = 'sheet-list-item';
      item.innerHTML =
        '<label><input type="checkbox" checked data-sheet="' + escapeHtml(names[i]) + '" onchange="onExportSheetCheckChange(this)"> ' +
        escapeHtml(names[i]) + '</label>' +
        '<span class="sheet-list-preview" id="preview-' + i + '"></span>';
      container.appendChild(item);
    }

    document.getElementById('exportSelectAll').checked = true;
    onExportConfigChange();
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function onExportSelectAllChange() {
    var checked = document.getElementById('exportSelectAll').checked;
    var checkboxes = document.querySelectorAll('#exportSheetItems input[type=checkbox]');
    for (var i = 0; i < checkboxes.length; i++) {
      checkboxes[i].checked = checked;
      var name = checkboxes[i].getAttribute('data-sheet');
      exportState.selectedSheets[name] = checked;
    }
    onExportConfigChange();
  }

  function onExportSheetCheckChange(cb) {
    var name = cb.getAttribute('data-sheet');
    exportState.selectedSheets[name] = cb.checked;

    var checkboxes = document.querySelectorAll('#exportSheetItems input[type=checkbox]');
    var allChecked = true;
    for (var i = 0; i < checkboxes.length; i++) {
      if (!checkboxes[i].checked) { allChecked = false; break; }
    }
    document.getElementById('exportSelectAll').checked = allChecked;
    onExportConfigChange();
  }

  function onExportConfigChange() {
    clearTimeout(exportState.validationTimer);
    exportState.validationTimer = setTimeout(function() {
      updateExportPreviews();
      validateExportConfig();
    }, 150);
  }

  function sanitizeSheetName(name) {
    return (name || 'export').replace(/[^a-zA-Z0-9_一-鿿-]/g, '_');
  }


  function computeObjectKey(template, prefix, sheetName) {
    var now = new Date();
    var date = now.getFullYear() + '-' +
      String(now.getMonth() + 1).padStart(2, '0') + '-' +
      String(now.getDate()).padStart(2, '0');
    var time = String(now.getHours()).padStart(2, '0') +
      String(now.getMinutes()).padStart(2, '0') +
      String(now.getSeconds()).padStart(2, '0');
    var timestamp = date + '_' + time;
    var safeName = sanitizeSheetName(sheetName);

    return template
      .replace(/\{prefix\}/g, prefix)
      .replace(/\{sheet\}/g, safeName)
      .replace(/\{date\}/g, date)
      .replace(/\{time\}/g, time)
      .replace(/\{timestamp\}/g, timestamp);
  }

  function updateExportPreviews() {
    var prefix = document.getElementById('exportPrefix').value;
    var template = document.getElementById('exportTemplate').value || '{prefix}{sheet}_{date}.csv';
    var names = sheetNames || [];

    for (var i = 0; i < names.length; i++) {
      var el = document.getElementById('preview-' + i);
      if (el) {
        if (exportState.selectedSheets[names[i]]) {
          el.textContent = computeObjectKey(template, prefix, names[i]);
          el.title = el.textContent;
        } else {
          el.textContent = '';
          el.title = '';
        }
      }
    }

    var selected = getSelectedSheetNames();
    document.getElementById('exportSheetCount').textContent =
      selected.length + ' / ' + names.length;
  }

  function validateExportConfig() {
    var prefix = document.getElementById('exportPrefix').value;
    var template = document.getElementById('exportTemplate').value || '{prefix}{sheet}_{date}.csv';
    var selected = getSelectedSheetNames();
    var errors = [];

    var prefixEl = document.getElementById('exportPrefixValidation');
    if (prefix.indexOf('\\') !== -1) {
      prefixEl.className = 'export-validation error';
      prefixEl.textContent = t('exportValidationBackslash');
      errors.push('prefix');
    } else if (/^\//.test(prefix)) {
      prefixEl.className = 'export-validation error';
      prefixEl.textContent = t('exportValidationLeadingSlash');
      errors.push('prefix');
    } else {
      prefixEl.className = 'export-validation';
      prefixEl.textContent = '';
    }

    var templateEl = document.getElementById('exportTemplateValidation');
    if (selected.length >= 2 && template.indexOf('{sheet}') === -1) {
      templateEl.className = 'export-validation error';
      templateEl.textContent = t('exportValidationNoSheet');
      errors.push('template');
    } else {
      var keys = {};
      var duplicates = [];
      for (var i = 0; i < selected.length; i++) {
        var key = computeObjectKey(template, prefix, selected[i]);
        if (keys[key]) {
          duplicates.push(selected[i] + ' / ' + keys[key]);
        } else {
          keys[key] = selected[i];
        }
      }
      if (duplicates.length > 0) {
        templateEl.className = 'export-validation error';
        templateEl.textContent = t('exportValidationDuplicate') + ': ' + duplicates[0];
        errors.push('template');
      } else {
        var maxLen = 0;
        for (var i = 0; i < selected.length; i++) {
          var k = computeObjectKey(template, prefix, selected[i]);
          if (k.length > maxLen) maxLen = k.length;
        }
        if (maxLen > 1023) {
          templateEl.className = 'export-validation error';
          templateEl.textContent = t('exportValidationTooLong') + ' (' + maxLen + ')';
          errors.push('template');
        } else if (maxLen > 900) {
          templateEl.className = 'export-validation warning';
          templateEl.textContent = t('exportValidationNearLimit') + ' (' + maxLen + ')';
        } else {
          templateEl.className = 'export-validation';
          templateEl.textContent = '';
        }
      }
    }

    var btn = document.getElementById('btnExport');
    var canExport = errors.length === 0 && selected.length > 0 && !exportState.inProgress;
    btn.disabled = !canExport;
    btn.querySelector('#btnExportText').textContent =
      selected.length > 0 ? t('exportSelected') + ' (' + selected.length + ')' : t('exportBtn');
  }

  function getSelectedSheetNames() {
    var result = [];
    var names = sheetNames || [];
    for (var i = 0; i < names.length; i++) {
      if (exportState.selectedSheets[names[i]]) {
        result.push(names[i]);
      }
    }
    return result;
  }

  function startBatchExport() {
    if (exportState.inProgress) return;
    var selected = getSelectedSheetNames();
    if (selected.length === 0) return;

    var prefix = document.getElementById('exportPrefix').value;
    var template = document.getElementById('exportTemplate').value || '{prefix}{sheet}_{date}.csv';

    exportState.inProgress = true;
    var btn = document.getElementById('btnExport');
    btn.disabled = true;

    var resultPanel = document.getElementById('exportResult');
    resultPanel.style.display = 'block';
    resultPanel.innerHTML = '';

    var successCount = 0;
    var failCount = 0;
    var index = 0;

    function exportNext() {
      if (index >= selected.length) {
        exportState.inProgress = false;
        btn.disabled = false;
        validateExportConfig();
        var summary = document.createElement('div');
        summary.style.cssText = 'margin-top:8px;padding:8px;border-radius:4px;font-weight:500;font-size:12px;';
        if (failCount === 0) {
          summary.style.background = 'var(--success-bg)';
          summary.style.color = 'var(--success)';
          summary.textContent = t('exportAllDone') + ': ' + successCount + ' ' + t('exportSelected_');
        } else {
          summary.style.background = 'var(--warning-bg)';
          summary.style.color = '#b45309';
          summary.textContent = t('exportPartialDone') + ': ' + successCount + ' ' + t('exportSuccessCount') + ', ' + failCount + ' ' + t('exportFailCount');
        }
        resultPanel.appendChild(summary);

        if (successCount > 0) {
          google.script.run.saveExportPreferences(prefix, template);
        }
        return;
      }

      var sheetName = selected[index];
      var objectKey = computeObjectKey(template, prefix, sheetName);

      var itemEl = document.createElement('div');
      itemEl.className = 'export-result-item';
      itemEl.innerHTML = '<span class="spinner spinner-sm"></span> ' + escapeHtml(sheetName);
      resultPanel.appendChild(itemEl);

      btn.querySelector('#btnExportText').textContent =
        t('exportExporting') + ' (' + (index + 1) + '/' + selected.length + ')';

      google.script.run
        .withSuccessHandler(function(result) {
          if (result && result.success) {
            successCount++;
            itemEl.innerHTML = '<span class="icon-success">✓</span> ' +
              escapeHtml(sheetName) + ' <span style="color:var(--text-secondary);font-size:11px;">(' +
              result.rows + ' rows, ' + result.sizeFormatted + ')</span>';
          } else {
            failCount++;
            itemEl.innerHTML = '<span class="icon-error">✗</span> ' +
              escapeHtml(sheetName) + ' <span style="color:var(--danger);font-size:11px;">' + t('exportFailed') + '</span>';
          }
          index++;
          exportNext();
        })
        .withFailureHandler(function(err) {
          failCount++;
          var msg = (err && err.message) ? err.message : String(err || '');
          itemEl.innerHTML = '<span class="icon-error">✗</span> ' +
            escapeHtml(sheetName) + ' <span style="color:var(--danger);font-size:11px;">' +
            escapeHtml(msg) + '</span>';
          index++;
          exportNext();
        })
        .exportSheetToCsv(sheetName, objectKey);
    }

    exportNext();
  }

</script>
