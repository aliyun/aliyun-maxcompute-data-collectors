schema_version: 1
driver:
  name: maxcompute
  display_name: MaxCompute
  maintainer: Alibaba Cloud MaxCompute
  artifact_pattern: maxcompute-metabase-driver-{driver_version}.jar

policy:
  # Human-readable version of this block: README.md, "Compatibility".
  # A driver release declares one supported Metabase window, and the window is
  # the Metabase stable minor that is current when the driver ships.
  supported_window: current_stable_metabase_minor
  # Metabase minors that are no longer current are outside the window: they are
  # not tested for, and fixes are not backported to them.
  backport_to_non_current_minors: false
  # A Metabase version newer than the declared upper bound is untested, not
  # implicitly supported.
  newer_than_window: untested
  # Every verified cell must come from the released artifact named by
  # artifact_sha256, not from a local rebuild of the same source.
  verified_cells_require_released_artifact: true

releases:
  - driver_version: 0.1.1
    status: verification-pending
    artifact: maxcompute-metabase-driver-0.1.1.jar
    release_url: https://github.com/aliyun/aliyun-maxcompute-data-collectors/releases/tag/metabase-0.1.1
    artifact_sha256: b3beee5a5386152944cf160b01eefbf7b13bbbf443ce8b036c4c40ff9d3bf1fd
    metabase:
      target_range:
        min_inclusive: 0.63.0
        max_exclusive: 0.64.0
      # The released 0.1.1 JAR is still compiled against the 0.51.14 baseline.
      # Moving the build baseline and the CI pin inside the supported range is
      # a driver code change (the Metabase secret-value function differs before
      # and after 0.56) and lands before 0.1.2.
      build_baseline: 0.51.14
      window_note: >-
        Narrowed from the pre-policy target range ">=0.51.14, <0.64.0" to the
        current stable minor. Metabase 0.51.x and 0.52.x-0.55.x are documented
        as failing for two independent reasons and are not backported.
      observed_versions:
        - version: 0.63.19
          tested_at: "2026-10-06"
          in_supported_window: true
          plugin_load: pass
          database_connection: pass
          native_select_1: pass
          array_column_native_query: not_run
          note: >-
            Latest stable patch of the current window (image digest
            sha256:7324f83713df9851c6c7b6c8247098de14c0924fc3b868202f886df4877cd4ff). The ARRAY cell was not re-run here; 0.63.18 in the same minor
            holds it. Full schema sync and MBQL stay unverified, so this row
            does not promote the release.
        - version: 0.63.22
          tested_at: "2026-11-01"
          in_supported_window: true
          plugin_load: pass
          database_connection: pass
          native_select_1: pass
          array_column_native_query: not_run
          image_digest: sha256:c8677c9cab17a39b7167f04e0bec57c0cfa5d55906d8ba0a0408f55c417a4e4a
          note: >-
            Latest stable patch of the current window as of 2026-11-01 (upstream
            shipped 0.63.20 on 10-19 and 0.63.21/0.63.22 on 10-27). Re-run on the
            same published artifact bytes. The ARRAY cell was not re-run here;
            0.63.18 in the same minor holds it.
        - version: 0.63.18
          tested_at: "2026-09-24"
          in_supported_window: true
          plugin_load: pass
          database_connection: pass
          array_column_native_query: pass
          note: ARRAY columns return real arrays; a NULL array column returns null.
        - version: 0.60.15
          tested_at: "2026-09-24"
          in_supported_window: false
          plugin_load: pass
          database_connection: pass
          array_column_native_query: pass
          note: Observation only; outside the window and not re-tested per release.
        - version: 0.56.25.1
          tested_at: "2026-09-24"
          in_supported_window: false
          plugin_load: pass
          database_connection: pass
          array_column_native_query: pass
          note: Observation only; outside the window and not re-tested per release.
        - version: 0.51.14
          tested_at: "2026-09-24"
          in_supported_window: false
          plugin_load: pass
          database_connection: pass
          array_column_native_query: fail
          note: ARRAY columns reach the UI as the unrendered OdpsArray object reference because that host does not serialize java.sql.Array.
        - version: 0.52.14
          tested_at: "2026-09-24"
          in_supported_window: false
          plugin_load: pass
          database_connection: fail
          note: >-
            Database creation returns HTTP 400: the secret-value function was
            renamed to value-as-string in 0.52 and takes an extra argument.
        - version: 0.53.12
          tested_at: "2026-09-24"
          in_supported_window: false
          plugin_load: pass
          database_connection: fail
        - version: 0.54.10
          tested_at: "2026-09-24"
          in_supported_window: false
          plugin_load: pass
          database_connection: fail
        - version: 0.55.10
          tested_at: "2026-09-24"
          in_supported_window: false
          plugin_load: pass
          database_connection: fail
          note: >-
            Same failure as 0.52.x-0.54.x; there the function also moved to the
            metabase.secrets.models.secret namespace.
      # These observations do not satisfy CONTRIBUTING.md's full acceptance suite.
      # Promote this release only after all five checks pass on this artifact.
        - version: 0.63.22
          tested_at: "2026-11-08"
          in_supported_window: true
          run: repository real-E2E gate (plugin load / database / native SELECT 1 / full sync / MBQL)
          image_digest: sha256:c8677c9cab17a39b7167f04e0bec57c0cfa5d55906d8ba0a0408f55c417a4e4a
          plugin_load: pass
          database_connection: pass
          native_select_1: pass
          full_schema_sync: pass
          table_count: 18
          field_count: 42
          mbql_query: not_determined
          array_column_native_query: not_run
          corrected_at: "2026-11-11"
          corrected_again_at: "2026-11-13"
          superseded_by: >-
            the three 2026-11-11 rows below - same image, same released artifact,
            same project shape, MBQL cell with its early-abort and one-row
            assumptions removed.
          note: >-
            CORRECTED 2026-11-11: this row read mbql_query: fail when the pull
            request was first pushed. That was an over-claim taken from the gate's
            exit status, not from a query result. CORRECTED AGAIN 2026-11-13,
            because the first correction added two claims of its own that no
            reading supported: that the cell's success test cannot read the
            asynchronous 202 response, and that the second non-answering table
            fails while loading column statistics. Both are wrong. Every answered
            candidate on 0.51.14, 0.63.22 and 0.64.4 returns HTTP 202 whose body is
            already terminal (status "completed", data.rows present), so the status
            code was never the problem; and the fixed cell names the two failing
            tables - a view whose base table was deleted (ODPS-0130071, HTTP 400)
            and a table holding a Long value below -2^63 (HTTP 500, InvalidData:
            Bigint out of range). What the cell as shipped here really does is stop
            at the first HTTP 400 (each candidate is read with curl -fsS inside a
            command substitution under set -euo pipefail, scripts/run-real-e2e.sh:3
            and :310-337) and require exactly one row (line 330), so five
            completed-empty candidates in this project could never satisfy it
            either. The value stays not_determined, matching the same cell in the
            driver's build repository, and here it means one thing only: this run
            produced no verdict for that cell. Plugin load, database creation,
            native SELECT 1 and full schema sync (18 tables / 42 fields, 20.8 s)
            are separate observations and stand.
        - version: 0.51.14
          tested_at: "2026-11-08"
          in_supported_window: false
          run: repository real-E2E gate, control reading only
          plugin_load: pass
          database_connection: pass
          native_select_1: pass
          full_schema_sync: pass
          mbql_query: pass
          corrected_again_at: "2026-11-13"
          note: >-
            Reported as a control, not as support. Why the identical cell went
            green here and died on 0.63.22 over the same artifact and the same
            project is now measured, and it is not sync versus async: on 0.51.14 a
            failing candidate arrives as HTTP 202 with the failure inside the body,
            so curl -f never saw an error and the loop kept going; on 0.63.22 the
            same kind of failure arrives as HTTP 400 and ends the cell. The driver
            did not change and neither did the project - only where Metabase
            carries a query error. Re-measured with the fixed cell in the rows
            below, where this line answers the same 16 of 18 as 0.63.22.
        - version: 0.63.22
          tested_at: "2026-11-11"
          in_supported_window: true
          run: >-
            repository real-E2E gate, MBQL cell fixed (the cell in
            scripts/run-real-e2e.sh as shipped here stops at the first HTTP 400 and
            demands exactly one row; these rows were produced with that behaviour
            removed, and that change is under review in the driver's build
            repository, not merged)
          image_digest: sha256:c8677c9cab17a39b7167f04e0bec57c0cfa5d55906d8ba0a0408f55c417a4e4a
          plugin_load: pass
          database_connection: pass
          native_select_1: pass
          full_schema_sync: pass
          table_count: 18
          field_count: 42
          mbql_query: pass
          mbql_candidates:
            probed: 18
            answered: 16
            answered_with_rows: 11
            answered_empty: 5
            error: 2
          mbql_response_shape:
            http: 202
            status: completed
            terminal_in_first_response: true
            waited_for_async_job: false
          note: >-
            In-window cell, decided from the gate itself. 16 of 18 active synced
            tables answer MBQL with this released artifact; the 2 that do not are
            named by the cell and are project housekeeping, not an MBQL
            limitation. 5 candidates answer with no rows, which the shipped cell
            cannot count as a pass. One small two-layer project: sync at
            large-project scale and MBQL on a schema-enabled project stay open
            below, and nothing here says the cell in this directory is fixed.
        - version: 0.51.14
          tested_at: "2026-11-11"
          in_supported_window: false
          run: repository real-E2E gate, MBQL cell fixed, control reading only
          image_digest: sha256:5024b74e767a3dc050b82f2dd65934ed3871b798e316ab2c42c8b1f89e22e1ea
          plugin_load: pass
          database_connection: pass
          native_select_1: pass
          full_schema_sync: pass
          table_count: 18
          field_count: 42
          mbql_query: pass
          mbql_candidates:
            probed: 18
            answered: 16
            answered_with_rows: 11
            answered_empty: 5
            error: 2
          mbql_response_shape:
            http: 202
            status: completed
            terminal_in_first_response: true
            waited_for_async_job: false
          note: >-
            Control on the build baseline, outside the window. Same counts as the
            0.63.22 row, and the same two tables are the failures.
        - version: 0.64.4
          tested_at: "2026-11-11"
          in_supported_window: false
          run: repository real-E2E gate, MBQL cell fixed
          image_digest: sha256:91b1af493aa75dcb53085d3dd53caca1ca0089af2150a9dc07025be4f786f9fe
          plugin_load: pass
          database_connection: pass
          native_select_1: pass
          full_schema_sync: pass
          table_count: 18
          field_count: 42
          mbql_query: fail
          mbql_candidates:
            probed: 18
            answered: 0
            answered_with_rows: 0
            answered_empty: 0
            error: 18
          mbql_response_shape:
            http: 400
            status: failed
            error_code: ODPS-0130071
            terminal_in_first_response: true
            waited_for_async_job: false
          note: >-
            Outside the window, and now a decided reading rather than an aborted
            one: all 18 candidates answer HTTP 400 with ODPS-0130071, the
            two-layer double-qualification defect. Native SELECT 1 passes on the
            same connection and project shape in the same run, so this is specific
            to the MBQL path. As a control, a locally built artifact carrying the
            fix under review turns this same cell green on the same image and
            project - 16 of 18 answered. That control is an observation only: it is
            not a released artifact, so under
            policy.verified_cells_require_released_artifact it is not a verified
            cell and moves no boundary in this matrix.
      range_load_smoke:
        method: release-image-plugin-load
        coverage: latest published patch of every minor in the pre-policy range ">=0.51.14, <0.64.0"
        tested_at: "2026-10-06"
        artifact_sha256: b3beee5a5386152944cf160b01eefbf7b13bbbf443ce8b036c4c40ff9d3bf1fd
        result: pass
        versions: 0.51.14, 0.52.17, 0.53.18, 0.54.24, 0.55.24, 0.56.25, 0.57.20, 0.58.35, 0.59.31, 0.60.27, 0.61.21, 0.62.19, 0.63.19
        coverage_refresh: >-
          That sweep ran on 2026-10-06. Upstream has since shipped 0.63.20,
          0.63.21 and 0.63.22, so the in-window minor's latest patch is now
          0.63.22 and that row is in observed_versions; the two intermediate
          patches were not tested, because the policy asks for the latest patch
          of each minor and they are no longer it.
        note: >-
          Plugin load only, on the published bytes. Per the supported-window
          policy these out-of-window minors are observations, not commitments.
      boundary_candidates:
        - version: 0.64.0-beta
          release_image: metabase/metabase:v0.64.0-beta
          image_digest: sha256:b419625d1d4a15581a18752d0d80e6e6f9d71bc2350f5bf8fda752436c208de8
          tested_at: "2026-10-06"
          plugin_load: pass
          dependency_surface: >-
            All 48 Metabase namespaces and vars this driver requires or extends
            resolve identically to 0.63.19.
          in_supported_window: false
          decision: excluded
          reason: >-
            Written 2026-10-06, when 0.64 had no stable release: a pre-release is
            not a window target and there was no data-path cell above 0.63.19.
            That premise has since changed -- 0.64 went GA on 2026-10-07 and
            0.64.4 shipped 2026-10-30 -- so this row is a historical reading of
            the beta, not the current boundary decision. Whether the window
            extends past 0.64.0 is taken on a separate 0.64.x verification line
            in the driver's build repository, which tests this same published
            artifact against the current 0.64 GA patch; that line supersedes this
            row when it lands. Nothing here raises the upper bound.
      known_failures:
        - name: mbql_query_e2e
          applies_to: >-
            projects without the schema model (two-layer) AND Metabase 0.64 or
            later - that is, outside the window declared above. Corrected
            2026-11-11: this entry was first written as if it also applied to
            0.63.22.
          observed_on: 0.64.4 and 0.65.2
          observed_at: "2026-11-10"
          still_works_on: >-
            0.63.22 - 16 of 18 synced tables answer MBQL with this artifact. The
            table name is still written twice in the generated FROM clause, but
            0.63.x emits the column reference in the matching shape, so the
            server resolves it.
          symptom: >-
            From Metabase 0.64 on, every question built from a synced table of
            such a project fails with ODPS-0130071 (column cannot be resolved),
            while plugin load, database creation, full schema sync and native SQL
            all work on the same connection.
          status: >-
            A fix is under review in the driver's build repository. It is
            expected to restore 16 of 18 on 0.63.x without changing behaviour
            there, and to make 0.64 and later answer the same 16. The
            user-facing wording is in pull request #167.
          gate_caveat: >-
            Do not use this module's scripts/run-real-e2e.sh as the MBQL oracle in
            the shape it ships today: every candidate is read with curl -fsS inside
            a command substitution under set -euo pipefail (lines 3 and 310-337),
            so the first HTTP 400 ends the whole cell and no failing table is named,
            and the success test requires exactly one row (line 330), so a table
            that completes with no rows cannot pass. Corrected 2026-11-13: an
            earlier revision of this note also blamed the asynchronous 202 response,
            which is false - the 202 body is terminal and readable, and the fix that
            produced the rows above keeps reading it. A patch to this cell is under
            review in the driver's build repository; until it lands here, re-running
            the shipped script on this project reproduces the no-verdict row.
      not_verified:
        - name: full_schema_sync_e2e_large_project
          reason: >-
            The sync pass above is a small project (18 tables). Scale is still
            unproven: the shared large project (tens of thousands of tables)
            did not finish inside bounded windows (1,800 s x2 and one solo
            4,500 s run). Not verified, not a pass.
        - name: mbql_query_e2e_schema_enabled
          reason: >-
            No MBQL reading exists for a project with the schema model enabled,
            in either direction. It is not claimed as working. Attempted again
            2026-11-13 with MAXCOMPUTE_NAMESPACE_SCHEMA=true on the two-layer
            project these cells use: the run stops in the sync step because the
            server reports that project is not a 3-tier model project, while the
            gate waits out its 300 s budget on a sync it has already marked
            aborted instead of reading that state back, so neither 0.63.22 nor
            0.64.4 produced an MBQL result. This cell needs a genuinely
            schema-enabled project, not another attempt on this one.
    evidence:
      - docs/e2e/v0.1.1-metabase-supported-window.md
      - docs/e2e/v0.1.1-range-load-smoke-2026-10-06.md
    odps_jdbc:
      version: 3.10.14
      distribution: bundled
  - driver_version: 0.1.0
    status: superseded
    superseded_by: 0.1.1
    artifact: maxcompute-metabase-driver-0.1.0.jar
    # Retained as a historical verification record. Its target range below
    # predates the supported-window policy and is not a support claim for
    # Metabase 0.51.x-0.55.x; on 0.51.14 only plugin load was checked, never a
    # data-path cell.
    metabase:
      target_range:
        min_inclusive: 0.51.14
        max_exclusive: 0.64.0
      build_baseline: 0.51.14
      range_policy:
        artifact_identity: same-sha256
        load_smoke: latest patch of every minor in the target range
        full_e2e: production version, range boundaries, and API-transition anchors
      load_smoke_versions:
        - version: 0.51.14
          source_revision: 0b92e01218eca4f797df4b1c5827222610145442
          tested_at: "2026-07-29"
          result: pass
        - version: 0.56.25.1
          source_revision: 835658ec7bd2d596a18d9b4d792ccc5ba04a743f
          role: driver-api-transition
          tested_at: "2026-07-29"
          result: pass
        - version: 0.60.15
          source_revision: 21b44885fe4fbcf0ca57282e4ef27cb8ce048ef7
          role: interior-anchor
          tested_at: "2026-07-29"
          result: pass
      tested_versions:
        - version: 0.63.1.12
          tested_at: "2026-07-29"
          test_level: full_e2e
          plugin_load: pass
          database_connection: pass
          full_schema_sync: pass
          table_count: 998
          field_count: 6943
          native_query: pass
          mbql_query: pass
      pending_full_e2e:
        - version: null
          role: exact-production-0.51.x
        - version: 0.51.14
          role: minimum-line-latest-patch
        - version: 0.56.25.1
          role: driver-api-transition
        - version: 0.60.15
          role: interior-anchor
    java:
      release_build_runtime: "25"
      tested_artifact_build_runtime: "23.0.1"
      load_smoke_runtime: "23.0.1"
      full_e2e_runtimes:
        - metabase_version: 0.63.1.12
          java_version: "25.0.3"
    odps_jdbc:
      version: 3.10.11
      distribution: bundled
    tested_artifact:
      filename: maxcompute-metabase-driver-0.1.0.jar
      sha256: 20f1c6ab6c8700cfd80a126918077a60bde633b1e447a0baca59ee17c457f346
    evidence:
      - docs/e2e/v0.1.0-load-smoke.md
      - docs/e2e/v0.1.0-metabase-v0.63.1.12.md
      - docs/e2e/v0.1.0-metabase-v0.63.1.12.json

  - driver_version: 0.0.5
    status: legacy
    metabase:
      target_range:
        min_inclusive: 0.50.0
        max_exclusive: 0.51.0
      tested_versions:
        - version: 0.50.21
          tested_at: null
    java:
      official_metabase_runtime: "11"
    odps_jdbc:
      version: external
      distribution: separate
    evidence: []
